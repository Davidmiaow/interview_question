[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "medicare_chronic_conditions_cost_analysis_network_optimization"
version = "0.0.1"
description = "This project is used for interview of optumn senior data scientist position"
authors = [
  { name = "MIAO WEI" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["medicare_chronic_conditions_cost_analysis_network_optimization"]
include = ["pyproject.toml", "medicare_chronic_conditions_cost_analysis_network_optimization/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["medicare_chronic_conditions_cost_analysis_network_optimization"]
force-sort-within-sections = true

